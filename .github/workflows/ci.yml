name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - run: uv sync

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: PYTHONPATH=. uv run coverage run --source=obesity -m pytest
      - run: uv run coverage report --show-missing
      - run: PYTHONPATH=. uv run mypy main.py obesity/ tests/ data/eda.py && uv run mypy audit/ && uv run mypy experiments/
