[project]
name = "obesity"
version = "0.1.0"
description = "Obesity Classification Pipeline"
requires-python = ">=3.12"
dependencies = [
	"fsspec>=2026.9.0",
	"huggingface-hub>=1.33.0",
	"hydra-core>=1.3.8",
	"pandas>=3.1.0",
	"scikit-learn>=1.9.1",
	"tabpfn>=8.5.0",
	"torch>=2.15.0",
	"torchaudio>=2.11.1",
	"torchvision>=0.29.2",
]

[dependency-groups]
agent = [
    "ipython>=9.17.1",
    "pyright>=1.1.414",
    "skore[jupyter]>=0.29.0",
    "skrub>=0.11.0",
]

dev = [
    "bandit>=1.9.4",
    "coverage>=7.17.0",
    "deptry>=0.25.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["obesity*"]
